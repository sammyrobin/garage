# Local development: http://localhost:8090/garage/ (override with GARAGE_PORT)
# Local inbox (Mailpit): http://localhost:8025
# The database is the SQLite file storage/garage.sqlite (created by bin/migrate.php).
services:
  app:
    build: ./docker
    working_dir: /var/www/html/garage
    ports:
      - "${GARAGE_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html/garage
    environment:
      # Local-only config (ignored by git); production uses app/config.php.
      GARAGE_CONFIG: /var/www/html/garage/app/config.local.php
    depends_on:
      - mail

  # Catches every e-mail sent locally: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
