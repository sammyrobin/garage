# Local development: http://localhost:8090/garage/ (override with GARAGE_PORT)
# Credentials below are for the disposable local database only.
services:
  app:
    build: ./docker
    working_dir: /var/www/html/garage
    ports:
      - "${GARAGE_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html/garage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: garage
      MYSQL_USER: garage
      MYSQL_PASSWORD: garage_local
      MYSQL_ROOT_PASSWORD: root_local
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
